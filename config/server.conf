port = 8080
host = 0.0.0.0

log_level = debug
log_console = true
log_file = true
log_directory = logs

worker_threads = 4

# URL paths are resolved inside this directory.
document_root = public

# GET / serves index_file. Missing paths serve not_found_page.
index_file = index.html
not_found_page = 404.html

# MIME table lines use: extension media/type
mime_types_file = config/mime.types
default_mime_type = application/octet-stream

# Reject static files larger than this limit.
max_static_file_size_mb = 64

# Leave blank to use the system CUPS server. When set, use host[:port].
# cups_server = print-server.example:631
cups_encryption_required = false

# Private SQLite database. The parent directory is created with mode 0700.
database_path = data/server.sqlite

# Admin-only account creation/password reset credential. Generate a secret with:
# openssl rand -hex 32
# Send it only in the Authorization: Bearer header to /api/admin/*.
# admin_api_token =
